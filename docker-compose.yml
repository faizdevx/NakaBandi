services:
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  db:
    profiles: [history]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nakabandi
      POSTGRES_PASSWORD: nakabandi
      POSTGRES_DB: nakabandi
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
